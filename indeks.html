<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Qizilbash Safavids</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #064e3b, #022c22);
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: rgba(4, 47, 31, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 2px solid #d97706;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Gaya untuk Foto/Logo di bagian atas */
        .form-logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #fbbf24;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #fbbf24;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 14px;
            color: #a7f3d0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f3f4f6;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background-color: #064e3b;
            border: 1px solid #047857;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        /* Tombol Kirim Form */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #d97706;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            display: block;
        }

        .btn-submit:hover {
            background-color: #b45309;
        }

        .divider {
            margin: 25px 0 20px 0;
            border: none;
            border-top: 1px dashed #047857;
        }

        /* Tombol Link Grup WA */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp:hover {
            background-color: #1ebd58;
        }

        .btn-whatsapp svg {
            margin-right: 8px;
            fill: white;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        
        <img src="URL_LINK_FOTO_ANDA" alt="Logo QS" class="form-logo" onerror="this.style.display='none'">

        <h2>Pendaftaran QS</h2>
        <p class="subtitle">Qizilbash Safavids Recruitment</p>
        
        <form id="formPendaftaran" onsubmit="kirimForm(event)">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda..." required>
            </div>

            <div class="form-group">
                <label for="umur">Umur (Minimal 10 Tahun)</label>
                <input type="number" id="umur" min="10" placeholder="Contoh: 15" required>
            </div>

            <div class="form-group">
                <label for="alasan">Alasan Masuk</label>
                <textarea id="alasan" placeholder="Tuliskan alasan Anda..." required></textarea>
            </div>

            <div class="form-group">
                <label for="sumber_link">Dapat Link Dari Mana?</label>
                <select id="sumber_link" required>
                    <option value="" disabled selected>-- Pilih Sumber Link --</option>
                    <option value="HNC">HNC</option>
                    <option value="GHC">GHC</option>
                    <option value="HIW">HIW</option>
                    <option value="WHC">WHC</option>
                    <option value="PSRA">PSRA</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Kirim Pendaftaran</button>
        </form>

        <hr class="divider">

        <a href="https://chat.whatsapp.com/LufBmxNqs2FKFpWy22t70j?s=cl&p=a&mlu=1" target="_blank" class="btn-whatsapp">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397 0 11.99 0c3.196.001 6.199 1.242 8.455 3.499 2.256 2.257 3.493 5.26 3.492 8.457-.003 6.643-5.339 11.99-11.93 11.99-2.005-.001-3.974-.504-5.713-1.463L0 24zm6.59-4.846c1.6.95 3.16 1.449 4.807 1.451 5.4 0 9.792-4.384 9.794-9.773.001-2.61-1.01-5.064-2.847-6.903C16.504 2.09 14.058.857 11.451.856 6.052.856 1.66 5.24 1.658 10.63c-.001 1.71.46 3.383 1.332 4.87L2.01 21.99l6.637-1.742c-.001 0 0 0 0 0zm11.373-5.234c-.302-.151-1.786-.882-2.063-.982-.277-.1-.478-.151-.68.151-.202.302-.782.982-.958 1.183-.176.202-.353.226-.655.076-1.3-.65-2.21-1.144-3.084-2.646-.232-.398.232-.37.664-1.231.075-.151.038-.284-.019-.398-.056-.113-.478-1.151-.655-1.579-.173-.414-.364-.358-.501-.365-.13-.006-.277-.007-.424-.007-.148 0-.388.056-.591.28-.203.226-.775.757-.775 1.84 0 1.084.789 2.133.9 2.283.11.15 1.55 2.369 3.756 3.322.524.227.935.362 1.255.464.527.167 1.007.143 1.387.086.423-.063 1.284-.524 1.466-1.031.181-.506.181-.941.126-1.031-.056-.09-.203-.142-.505-.292z"/>
            </svg>
            Gabung Grup Utama WhatsApp
        </a>
    </div>

    <script>
        function kirimForm(event) {
            // Menghentikan submit default agar browser tidak melalukan refresh otomatis
            event.preventDefault(); 

            // Nomor admin tujuan (Nomor Anda)
            const nomorAdmin = "+6285136572948"; 

            // Mengambil semua isi data input pendaftar
            const nama = document.getElementById('nama').value;
            const umur = document.getElementById('umur').value;
            const alasan = document.getElementById('alasan').value;
            const sumber = document.getElementById('sumber_link').value;

            // Format Teks Pesan WhatsApp (Menggunakan cetak tebal dan enter baris baru)
            const teksPesan = 
                "*PENDAFTARAN RECRUITMENT QS*" + "%0A" +
                "==============================" + "%0A%0A" +
                "*Nama Lengkap :* " + encodeURIComponent(nama) + "%0A" +
                "*Umur :* " + encodeURIComponent(umur) + " Tahun" + "%0A" +
                "*Alasan Masuk :* " + encodeURIComponent(alasan) + "%0A" +
                "*Sumber Link :* " + encodeURIComponent(sumber) + "%0A%0A" +
                "==============================";

            // Membuka paksa aplikasi WhatsApp di HP pendaftar dengan link resmi WhatsApp API
            const urlWA = `https://api.whatsapp.com/send?phone=${nomorAdmin}&text=${teksPesan}`;
            window.location.href = urlWA;
        }
    </script>

</body>
</html>
